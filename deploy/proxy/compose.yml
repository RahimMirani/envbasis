name: envbasis-proxy

services:
  proxy:
    image: envbasis-proxy:local
    build:
      context: ../../proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - proxy.env
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PROXY_DOMAIN: ${PROXY_DOMAIN:?Set PROXY_DOMAIN in deploy/proxy/.env}
    depends_on:
      proxy:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
